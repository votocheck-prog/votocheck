<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.s{position:relative;width:1200px;height:630px;color:#fff;padding:56px 64px;background:radial-gradient(700px 400px at 100% -10%,#1C3FA8 0%,rgba(28,63,168,0) 60%),radial-gradient(500px 360px at -5% 110%,rgba(0,180,149,.32) 0%,rgba(0,180,149,0) 60%),#0A1440;display:grid;grid-template-columns:230px 1fr;gap:44px;align-items:center}
.s::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.s>*{position:relative;z-index:1}
.foto{width:230px;height:280px;border-radius:28px;background:linear-gradient(135deg,#1B2A70,#223A9A);display:grid;place-items:center;overflow:hidden;font-family:"Plus Jakarta Sans";font-weight:800;font-size:120px;color:#7FB0FF;border:2px solid rgba(255,255,255,.14)}
.foto img{width:100%;height:100%;object-fit:cover}
.eb{font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7FB0FF;margin-bottom:14px}
h1{font-family:"Plus Jakarta Sans";font-weight:800;font-size:64px;letter-spacing:-.03em;line-height:1.02;margin-bottom:16px;max-width:820px}
.meta{font-size:28px;color:#C3CDF0;margin-bottom:26px}
.num{display:inline-flex;align-items:center;gap:22px;background:#fff;color:#0A1440;border-radius:20px;padding:14px 26px}
.num small{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6478;line-height:1.2}
.num b{font-family:"Plus Jakarta Sans";font-size:64px;font-weight:800;letter-spacing:.06em;line-height:1}
.rod{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-size:21px;color:#9AA7D6}
.rod img{height:40px}
</style></head><body><div class="s">
<div class="foto" id="foto"></div>
<div><div class="eb">Eleições 2026 · candidatura</div><h1 id="nome"></h1><div class="meta" id="meta"></div><div class="num"><small>Número<br>na urna</small><b id="num"></b></div></div>
<div class="rod"><span>Patrimônio, votos e com quem o voto soma · com fonte oficial</span><img src="logo_h_branco.png"></div>
</div>
<script>
function nomeProprio(s){if(!s)return'';if(s!==s.toUpperCase())return s;const m=new Set(['da','de','do','das','dos','e']);return s.toLowerCase().split(/(\s+|-)/).map((w,i)=>m.has(w)&&i>0?w:w.charAt(0).toUpperCase()+w.slice(1)).join('')}
window.set=function(c){
  const n=nomeProprio(c.nome||'');
  document.getElementById('nome').textContent=n;
  document.getElementById('nome').style.fontSize=(n.length>26?48:n.length>18?56:64)+'px';
  document.getElementById('meta').textContent=[c.cargo, c.slug==='presidente'?'Brasil':c.uf, c.partido].filter(Boolean).join(' · ');
  document.getElementById('num').textContent=c.numero||'—';
  const f=document.getElementById('foto');
  if(c.foto){f.innerHTML='';const im=new Image();im.src=c.foto;f.appendChild(im);return new Promise(r=>{im.onload=r;im.onerror=()=>{f.textContent=n.charAt(0);r()};setTimeout(r,4000)})}
  f.textContent=n.charAt(0); return Promise.resolve();
}
</script></body></html>
