# VotoCheck — Configuração Cloudflare Worker
# Documentação: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "votocheck-coletor"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "22688effbd9ab181498d04ccd2cc8d2e"

# Banco D1 — depois de criar com `wrangler d1 create votocheck-db`, cole o database_id retornado aqui.
[[d1_databases]]
binding = "DB"
database_name = "votocheck-db"
database_id = "1de4bbee-3c8c-4043-91f9-fafd527c2f1f"

# Cron Trigger — dispara a coleta automaticamente.
#
# ATUALIZADO em 18/09/2026 (auditoria de continuidade): reduzido de 4x/dia para 1x/dia.
# Motivos:
#  1) O plano free do D1 tem teto diário de linhas escritas — rodar a sequência completa
#     várias vezes ao dia aumenta o risco de estourar a cota no meio de uma coleta (já
#     aconteceu). Câmara/Senado não mudam rápido o suficiente para justificar mais de 1x/dia.
#  2) O handler scheduled() agora isola cada coletor em try/catch (ver src/index.js) — uma
#     falha do TSE não trava mais Câmara/Senado. Ainda assim, menos disparos = menos exposição
#     ao bloqueio intermitente da Akamai (TSE) e ao teto de subrequests por invocação.
#  3) O coletor de TSE (candidatos/redes sociais/bens) continua no cron como "melhor esforço",
#     mas a carga de volume e a atualização de rotina do TSE são feitas manualmente (baixar
#     ZIP do navegador + aplicar via API no D1) — ver CONTINUIDADE_INFRA_UPDATE_2026-09-18.md.
#
# Horário escolhido: 07:00 UTC (04:00 em São Paulo) — fora do horário de maior uso do site.
[triggers]
crons = ["0 7 * * *"]

# Variáveis de ambiente não-sensíveis (segredos como ADMIN_TOKEN devem ir via
# `wrangler secret put ADMIN_TOKEN`, nunca aqui em texto plano — regra de segurança do projeto).
[vars]
# FALLBACK_BASE_URL = "https://mirror-exemplo.com/tse"  # descomente se precisar de um mirror
